services:
  broker:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/acl:/mosquitto/config/acl:ro
      - ./broker/secrets:/mosquitto/config/secrets:ro
      - broker-data:/mosquitto/data
volumes:
  broker-data:
